[project]
name = "scolastica-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=23.2.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.2",
    "pillow>=10.0.0",
    "anthropic>=0.40.0",
    "supabase>=2.10.0",
]

[tool.vercel]
entrypoint = "main:app"
